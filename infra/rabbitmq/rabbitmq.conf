# DERCAS-ONCO-XAI RabbitMQ Configuration

# Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.8
disk_free_limit.absolute = 2GB

# Networking
listeners.tcp.default = 5672
management.tcp.port = 15672

# SSL/TLS (disabled for development)
listeners.ssl = none

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.file = false

# Default user (will be overridden by environment variables)
default_user = guest
default_pass = guest

# Virtual hosts
default_vhost = /

# Policies
# Enable HA for all queues
# policy.ha-all.pattern = .*
# policy.ha-all.definition.ha-mode = all
# policy.ha-all.definition.ha-sync-mode = automatic

# Message TTL for dead letter queues
policy.dlx-ttl.pattern = .*\.dlx
policy.dlx-ttl.definition.message-ttl = 86400000

# Queue length limits for safety
policy.max-length.pattern = .*
policy.max-length.definition.max-length = 10000

# Prometheus metrics
prometheus.tcp.port = 15692
prometheus.path = /metrics

# Management UI configuration
management.rates_mode = basic
