[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-validation-copilot"
version = "0.1.0"
description = "DERCAS 01 - Cabina Aseguradoras Policy Validation Copilot (TO-BE) with LangGraph + ML + Guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Policy Validation Team" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
]

[project.scripts]
policy-copilot = "policy_validation_copilot.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_validation_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
