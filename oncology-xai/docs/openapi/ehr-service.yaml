openapi: 3.1.0
info:
  title: Oncology XAI EHR Service
  description: EHR ingestion, entity extraction, and ontology mapping service
  version: 1.0.0

servers:
  - url: http://localhost:8004
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/cases/{case_id}/ehr:
    post:
      summary: Ingest EHR text for a case
      operationId: ingestEHR
      tags: [EHR]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EHRIngest'
      responses:
        '201':
          description: EHR ingested and processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EHRRecord'
    get:
      summary: Get EHR records for a case
      operationId: getCaseEHR
      tags: [EHR]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: EHR records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EHRRecord'

  /api/v1/cases/{case_id}/entities:
    get:
      summary: Get extracted entities for a case
      operationId: getCaseEntities
      tags: [Entities]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Extracted entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EHREntity'

  /api/v1/entities/{entity_id}/mappings:
    get:
      summary: Get ontology mappings for an entity
      operationId: getEntityMappings
      tags: [Mappings]
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ontology mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OntologyMapping'

  /api/v1/cases/{case_id}/explanation:
    get:
      summary: Get generated explanation for a case
      operationId: getCaseExplanation
      tags: [Explanation]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '404':
          description: No explanation available

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string

    EHRIngest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Raw EHR text to process
        source:
          type: string
          description: Source system identifier

    EHRRecord:
      type: object
      required: [ehr_id, case_id, raw_text]
      properties:
        ehr_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        raw_text:
          type: string
        source:
          type: string
          nullable: true
        ingested_at:
          type: string
          format: date-time
        processed:
          type: boolean

    EHREntity:
      type: object
      required: [entity_id, case_id, entity_type, raw_text]
      properties:
        entity_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [diagnosis, biomarker, medication, procedure, symptom, finding]
        raw_text:
          type: string
        normalized_text:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        span_start:
          type: integer
        span_end:
          type: integer

    OntologyMapping:
      type: object
      required: [mapping_id, entity_id, ontology, term_id, term_label]
      properties:
        mapping_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        ontology:
          type: string
          enum: [NCIt, MONDO, SO, HGNC, RxNorm]
        term_id:
          type: string
          description: e.g., NCIT:C3512
        term_label:
          type: string
        confidence:
          type: number
          format: float
        evidence:
          type: string
          nullable: true

    Explanation:
      type: object
      required: [explanation_id, case_id, content]
      properties:
        explanation_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        content:
          type: string
          description: Markdown-formatted explanation
        guardrails_passed:
          type: boolean
        guardrail_warnings:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
