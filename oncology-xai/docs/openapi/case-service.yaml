openapi: 3.1.0
info:
  title: Oncology XAI Case Service
  description: Patient and Case management service for oncology pathology platform
  version: 1.0.0
  contact:
    name: Oncology XAI Team

servers:
  - url: http://localhost:8001
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/patients:
    get:
      summary: List all patients
      operationId: listPatients
      tags: [Patients]
      responses:
        '200':
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
    post:
      summary: Create a new patient
      operationId: createPatient
      tags: [Patients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

  /api/v1/patients/{patient_id}:
    get:
      summary: Get patient by ID
      operationId: getPatient
      tags: [Patients]
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found

  /api/v1/cases:
    get:
      summary: List all cases
      operationId: listCases
      tags: [Cases]
      responses:
        '200':
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
    post:
      summary: Create a new case
      operationId: createCase
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'

  /api/v1/cases/{case_id}:
    get:
      summary: Get case by ID
      operationId: getCase
      tags: [Cases]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          description: Case not found
    patch:
      summary: Update case status
      operationId: updateCase
      tags: [Cases]
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdate'
      responses:
        '200':
          description: Case updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: case-service
        version:
          type: string
          example: 1.0.0

    Patient:
      type: object
      required: [patient_id, mrn]
      properties:
        patient_id:
          type: string
          format: uuid
        mrn:
          type: string
          example: MRN123456
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PatientCreate:
      type: object
      required: [mrn]
      properties:
        mrn:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string

    Case:
      type: object
      required: [case_id, patient_id, status]
      properties:
        case_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CaseCreate:
      type: object
      required: [patient_id]
      properties:
        patient_id:
          type: string
          format: uuid
        description:
          type: string

    CaseUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CaseStatus'
        description:
          type: string

    CaseStatus:
      type: string
      enum: [created, processing, completed, failed]
