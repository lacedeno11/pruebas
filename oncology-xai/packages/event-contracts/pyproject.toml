[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncology-event-contracts"
version = "0.1.0"
description = "Event contracts and envelope definitions for Oncology XAI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
