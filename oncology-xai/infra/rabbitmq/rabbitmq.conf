# DERCAS-ONCO-XAI V1 - RabbitMQ Configuration
# Message broker configuration for the oncology platform

# Cluster configuration
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Logging
log.console = true
log.console.level = info
log.file = false

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0

# Connection limits
num_acceptors.tcp = 10
handshake_timeout = 10000
heartbeat = 60

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.load_definitions = /etc/rabbitmq/definitions.json

# Default user (will be overridden by environment variables)
default_user = guest
default_pass = guest
default_user_tags.administrator = true
default_vhost = /

# Permissions
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Queue settings
queue_master_locator = min-masters

# Message TTL and size limits
max_message_size = 134217728

# TLS/SSL (disabled for development)
listeners.ssl = none
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
