version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: oncology-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oncology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncology_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oncology_xai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncology} -d ${POSTGRES_DB:-oncology_xai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncology-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: oncology-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncology-network

  # Redis (Celery backend)
  redis:
    image: redis:7-alpine
    container_name: oncology-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncology-network

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: oncology-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncology-network

  # MinIO client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: oncology-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb myminio/${S3_BUCKET:-oncology-xai} --ignore-existing;
      mc anonymous set download myminio/${S3_BUCKET:-oncology-xai}/public;
      exit 0;
      "
    networks:
      - oncology-network

  # Keycloak (Identity and Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: oncology-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oncology_xai}
      KC_DB_USERNAME: ${POSTGRES_USER:-oncology}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-oncology_secret}
      KC_HEALTH_ENABLED: true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - oncology-network

  # Apache Jena Fuseki (Triple Store / SPARQL)
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: oncology-fuseki
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: oncology
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki
      - ./fuseki/config.ttl:/fuseki/configuration/oncology.ttl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncology-network

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: oncology-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - oncology-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: oncology-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - oncology-network

  # Application Services
  api-gateway:
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
    container_name: oncology-api-gateway
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-oncology}
      - JWKS_URL=${JWKS_URL:-http://keycloak:8080/realms/oncology/protocol/openid-connect/certs}
      - CASE_SERVICE_URL=${CASE_SERVICE_URL:-http://case-service:8001}
      - IMAGE_SERVICE_URL=${IMAGE_SERVICE_URL:-http://image-service:8002}
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL:-http://inference-service:8003}
      - EHR_SERVICE_URL=${EHR_SERVICE_URL:-http://ehr-service:8004}
      - GRAPH_SERVICE_URL=${GRAPH_SERVICE_URL:-http://graph-service:8005}
      - ONTOLOGY_ADMIN_SERVICE_URL=${ONTOLOGY_ADMIN_SERVICE_URL:-http://ontology-admin-service:8006}
      - AUDIT_SERVICE_URL=${AUDIT_SERVICE_URL:-http://audit-service:8007}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - oncology-network

  case-service:
    build:
      context: ../apps/case-service
      dockerfile: Dockerfile
    container_name: oncology-case-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - oncology-network

  image-service:
    build:
      context: ../apps/image-service
      dockerfile: Dockerfile
    container_name: oncology-image-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-oncology-xai}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - oncology-network

  inference-service:
    build:
      context: ../apps/inference-service
      dockerfile: Dockerfile
    container_name: oncology-inference-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-oncology-xai}
      - MODEL_BACKEND=${MODEL_BACKEND:-mock}
      - TRITON_URL=${TRITON_URL:-http://triton:8001}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - PATTERN_THRESHOLD=${PATTERN_THRESHOLD:-0.55}
      - MUTATION_THRESHOLD=${MUTATION_THRESHOLD:-0.60}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oncology-network

  ehr-service:
    build:
      context: ../apps/ehr-service
      dockerfile: Dockerfile
    container_name: oncology-ehr-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-oncology-xai}
      - FUSEKI_URL=${FUSEKI_URL:-http://fuseki:3030}
      - FUSEKI_DATASET=${FUSEKI_DATASET:-oncology}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oncology-network

  graph-service:
    build:
      context: ../apps/graph-service
      dockerfile: Dockerfile
    container_name: oncology-graph-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - FUSEKI_URL=${FUSEKI_URL:-http://fuseki:3030}
      - FUSEKI_DATASET=${FUSEKI_DATASET:-oncology}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - oncology-network

  ontology-admin-service:
    build:
      context: ../apps/ontology-admin-service
      dockerfile: Dockerfile
    container_name: oncology-ontology-admin-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-oncology-xai}
      - FUSEKI_URL=${FUSEKI_URL:-http://fuseki:3030}
      - FUSEKI_DATASET=${FUSEKI_DATASET:-oncology}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oncology-network

  audit-service:
    build:
      context: ../apps/audit-service
      dockerfile: Dockerfile
    container_name: oncology-audit-service
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://oncology:oncology_secret@postgres:5432/oncology_xai}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - oncology-network

  webapp:
    build:
      context: ../apps/webapp
      dockerfile: Dockerfile
    container_name: oncology-webapp
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=oncology
      - VITE_KEYCLOAK_CLIENT_ID=oncology-webapp
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - oncology-network

networks:
  oncology-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  fuseki_data:
  prometheus_data:
