global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'case-service'
    static_configs:
      - targets: ['case-service:8001']
    metrics_path: '/metrics'

  - job_name: 'image-service'
    static_configs:
      - targets: ['image-service:8002']
    metrics_path: '/metrics'

  - job_name: 'inference-service'
    static_configs:
      - targets: ['inference-service:8003']
    metrics_path: '/metrics'

  - job_name: 'ehr-service'
    static_configs:
      - targets: ['ehr-service:8004']
    metrics_path: '/metrics'

  - job_name: 'graph-service'
    static_configs:
      - targets: ['graph-service:8005']
    metrics_path: '/metrics'

  - job_name: 'ontology-admin-service'
    static_configs:
      - targets: ['ontology-admin-service:8006']
    metrics_path: '/metrics'

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8007']
    metrics_path: '/metrics'
