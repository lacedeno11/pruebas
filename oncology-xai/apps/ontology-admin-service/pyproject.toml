[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncology-ontology-admin-service"
version = "0.1.0"
description = "Ontology Admin Service for Oncology XAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pika>=1.3.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "langgraph>=0.0.20",
    "rdflib>=7.0.0",
    "owlrl>=6.0.2",
    "oncology-common",
    "oncology-event-contracts",
    "oncology-langgraph-workflows",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_admin_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
