[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncology-xai-image-service"
version = "1.0.0"
description = "Image Service for DERCAS-ONCO-XAI V1 platform"
authors = [
    {name = "DERCAS Team", email = "team@dercas.com"},
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI and ASGI
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    
    # Object storage (MinIO/S3)
    "minio>=7.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    
    # Image processing and validation
    "pillow>=10.1.0",
    "python-magic>=0.4.27",
    "filetype>=1.2.0",
    
    # Validation and serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    
    # HTTP client
    "httpx>=0.25.0",
    
    # Monitoring and observability
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-exporter-jaeger>=1.20.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    
    # Shared packages
    "oncology-xai-common",
    "oncology-xai-event-contracts",
    
    # Utilities
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.0",
    "uuid7>=0.1.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
]

[project.urls]
Homepage = "https://github.com/dercas-team/oncology-xai"
Repository = "https://github.com/dercas-team/oncology-xai"
Documentation = "https://docs.dercas.com/oncology-xai"

[tool.hatch.build.targets.wheel]
packages = ["src/image_service"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "factory-boy",
    "faker",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=src/image_service {args:tests}"
lint = "ruff check {args:src tests}"
format = "black {args:src tests}"
type-check = "mypy {args:src}"
migrate = "alembic upgrade head"
migrate-create = "alembic revision --autogenerate -m {args}"

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]
"alembic/**/*" = ["F401", "F403"]

[tool.black]
target-version = ['py312']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
    "factory_boy.*",
    "faker.*",
    "minio.*",
    "magic.*",
    "filetype.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = ["src"]
version_path_separator = "os"
