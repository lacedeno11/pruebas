[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncology-image-service"
version = "0.1.0"
description = "Image Service for Oncology XAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.6",
    "pika>=1.3.0",
    "oncology-common",
    "oncology-event-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image_service"]
