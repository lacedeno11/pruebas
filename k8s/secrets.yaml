apiVersion: v1
kind: Secret
metadata:
  name: policy-copilot-secrets
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  DB_USERNAME: "policy_copilot_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT secret
  SECURITY_JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_LONG_RANDOM_STRING"
  SECURITY_ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION_32_CHAR_KEY"
  SECURITY_HASH_SALT: "CHANGE_ME_IN_PRODUCTION_SALT"
  
  # S3 credentials
  STORAGE_S3_ACCESS_KEY: "CHANGE_ME_AWS_ACCESS_KEY"
  STORAGE_S3_SECRET_KEY: "CHANGE_ME_AWS_SECRET_KEY"
  STORAGE_S3_BUCKET_NAME: "policy-copilot-storage"
  
  # Pinecone credentials (if using)
  VECTORDB_PINECONE_API_KEY: "CHANGE_ME_PINECONE_API_KEY"
  VECTORDB_PINECONE_ENVIRONMENT: "us-east1-gcp"
  VECTORDB_PINECONE_INDEX_NAME: "policy-documents"
  
  # Notification credentials
  NOTIFICATION_SMTP_USERNAME: "CHANGE_ME_SMTP_USER"
  NOTIFICATION_SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  NOTIFICATION_FROM_EMAIL: "noreply@policy-copilot.example.com"
  
  NOTIFICATION_SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGE_ME"
  NOTIFICATION_SLACK_BOT_TOKEN: "xoxb-CHANGE_ME_SLACK_TOKEN"
  
  NOTIFICATION_SMS_API_KEY: "CHANGE_ME_SMS_API_KEY"
  NOTIFICATION_SMS_FROM_NUMBER: "+1234567890"
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-copilot-tls
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Generate with: kubectl create secret tls policy-copilot-tls --cert=path/to/tls.crt --key=path/to/tls.key
  tls.crt: LS0tLS1CRUdJTi... # Replace with actual certificate
  tls.key: LS0tLS1CRUdJTi... # Replace with actual private key
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-copilot-registry
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker registry credentials
  # Generate with: kubectl create secret docker-registry policy-copilot-registry --docker-server=DOCKER_REGISTRY_SERVER --docker-username=DOCKER_USER --docker-password=DOCKER_PASSWORD --docker-email=DOCKER_EMAIL
  .dockerconfigjson: eyJhdXRocyI6e... # Replace with actual registry credentials
