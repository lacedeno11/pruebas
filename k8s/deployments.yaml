apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-copilot-api
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-copilot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-copilot
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: policy-copilot
      imagePullSecrets:
      - name: policy-copilot-registry
      containers:
      - name: api
        image: policy-copilot:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        envFrom:
        - configMapRef:
            name: policy-copilot-config
        - secretRef:
            name: policy-copilot-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: policy-copilot-storage
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: policy-copilot-config
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "amd64"
        effect: "NoSchedule"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-copilot-worker
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-copilot
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-copilot
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: policy-copilot
      imagePullSecrets:
      - name: policy-copilot-registry
      containers:
      - name: worker
        image: policy-copilot:latest
        imagePullPolicy: Always
        command: ["python", "-m", "policy_copilot.worker.main"]
        envFrom:
        - configMapRef:
            name: policy-copilot-config
        - secretRef:
            name: policy-copilot-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import policy_copilot.worker.health; exit(0 if policy_copilot.worker.health.is_healthy() else 1)"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: policy-copilot-storage
      - name: logs
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-copilot-scheduler
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-copilot
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-copilot
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: policy-copilot
      imagePullSecrets:
      - name: policy-copilot-registry
      containers:
      - name: scheduler
        image: policy-copilot:latest
        imagePullPolicy: Always
        command: ["python", "-m", "policy_copilot.scheduler.main"]
        envFrom:
        - configMapRef:
            name: policy-copilot-config
        - secretRef:
            name: policy-copilot-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import policy_copilot.scheduler.health; exit(0 if policy_copilot.scheduler.health.is_healthy() else 1)"
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: proxy
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-copilot
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-copilot
        app.kubernetes.io/component: proxy
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: policy-copilot-nginx-config
      nodeSelector:
        kubernetes.io/os: linux
