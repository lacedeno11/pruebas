apiVersion: v1
kind: Service
metadata:
  name: policy-copilot-api
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: policy-copilot-ml
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: ml
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: ml
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: proxy
    app.kubernetes.io/version: "1.0.0"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: proxy
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: vectordb
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: vectordb
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-copilot
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: policy-copilot
  name: policy-copilot-role
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-copilot-rolebinding
  namespace: policy-copilot
  labels:
    app.kubernetes.io/name: policy-copilot
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: policy-copilot
  namespace: policy-copilot
roleRef:
  kind: Role
  name: policy-copilot-role
  apiGroup: rbac.authorization.k8s.io
