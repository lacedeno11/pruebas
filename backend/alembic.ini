# Alembic Configuration for PEI Platform
#
# This configuration file specifies database migration settings for the PEI system.
# It uses SQLAlchemy with PostgreSQL async driver.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(asctime)s_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the `tzinfo` argument of datetime.datetime()
# Leave the line in place for default behavior.
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by Alembic.
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# If true, revision files will contain views as well as tables
# include_views = false

# If true, symbolic references to tables are generated in the
# downgrade process, if the metadata version was not specified.
# defaults to true
# mark_index = true

# Logging configuration
# Logging section for the actual logging module
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# SQL connection string.
# NOTE: This is configured via environment in env.py
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/pei_db

