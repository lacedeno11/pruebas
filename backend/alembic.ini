# Alembic Configuration File
# ==========================
# This file contains configuration for Alembic, the SQLAlchemy database migration tool.
# For more information, see https://alembic.sqlalchemy.org/

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field in %%(slug)s
# truncate_slug_len = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# When set to 'true', a "-vvv" flag to alembic will enable
# SQL execution echo to stderr before it happens
# sqlalchemy_echo_attr = sqlalchemy.pool.NullPool

# set to string 'false' to suppress the automatic
# generation of new alembic revision when application starts
# enable_branching = false

# format of the logging.config file
# logging_file_config = %(here)s/logging.ini

# set to string value 'false' to suppress automatic migration
# during application startup
# auto_upgrade = true

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

