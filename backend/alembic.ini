# Alembic Configuration File
# This file is the config for the Alembic revision environment.

[alembic]
# location of migration files
sqlalchemy.url = driver://user:password@localhost/dbname
script_location = alembic

# Logging configuration
# the output encoding used when revision files
# are written from script.py.mako
# string_affinity can be "strict" or "ignore_case"
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# leave as `None` to disable timestamp rendering
# timezone =

# max length of characters to apply to the
# "slug" field if truncating of the slug is needed.
# setting to -1 indicates no truncation
# truncate_slug_len = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Uncomment and configure as desired

# loggers section allows to set up non-root logging
# for alembic.migration and alembic.environment, that
# can be configured separate from the general logging
#
# loggers =
# keys = sqlalchemy.engine,sqlalchemy.pool,alembic.migration

# handlers =
# keys = console

# formatters =
# keys = generic

# root_level = WARN
# level = WARN
# handlers = console
# qualname =

# level = WARN
# handlers =
# qualname = sqlalchemy.engine

# level = WARN
# handlers =
# qualname = sqlalchemy.pool

# level = WARN
# handlers =
# qualname = alembic.migration

# level = DEBUG
# qualname =
# handlers = console
# propagate = 0

# level = DEBUG
# qualname = sqlalchemy.engine
# handlers =
# propagate = 0

# level = DEBUG
# qualname = sqlalchemy.pool
# handlers =
# propagate = 0

# level = DEBUG
# qualname = alembic
# handlers =
# propagate = 0

# formatters
# use the 'generic' formatter in all cases
# format = %(levelname)-5.5s [%(name)s] %(message)s
# datefmt = %H:%M:%S

# Default behavior for migrate_engines
# If not using sqlalchemy.url above, provide default
# sqlalchemy engine options
# sqlalchemy.echo = true
# sqlalchemy.echo_pool = true
# sqlalchemy.max_overflow = 10
# sqlalchemy.pool_size = 5
# sqlalchemy.pool_recycle = 3600
# sqlalchemy.pool_pre_ping = true

