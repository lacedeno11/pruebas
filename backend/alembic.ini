# Alembic Configuration File
# 
# This file is the configuration file for Alembic and contains settings for:
# - Database connection URL
# - Migration script location and template
# - Logging configuration
# - SQLAlchemy engine configuration

[alembic]
# Path to migration scripts
script_location = alembic

# File name template for auto-generated migration files
# Variables available: year, month, day, hour, minute, second, rev, slug
sqlalchemy.url = driver://user:password@localhost/dbname
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d-%%(rev)s_%%(slug)s

# Logging configuration
sqlalchemy.logging_name = sqlalchemy.engine
sqlalchemy.echo = 0
sqlalchemy.echo_pool = 0
sqlalchemy.pool_pre_ping = 1

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

