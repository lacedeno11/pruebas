# Alembic configuration file
# This file contains configuration for Alembic database migration management

# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date/time
sqlalchemy.url = sqlite:///./pei_platform.db

# Logging configuration
# the output encoding used when revision files
# are written from script.py.mako
# string value is passed through the
# set_main_option() function of the config, which translates % placeholders
# to their values within the config.struct
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current working directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed through the
# set_main_option() function of the config, which translates % placeholders
# to their values within the config.struct
# timezone =

# max length of the filename (template expanded) to generate migration files
# when using the datestamp + slug template
# string value is passed through the
# set_main_option() function of the config, which translates % placeholders
# to their values within the config.struct
# filename_template = %%(created_at)s_%%(rev)s_%%(slug)s

# Logging configuration
# When set to 'true', Alembic will display the names of the created/altered tables
sqlalchemy.echo = false

# level of logging detail; the possible values are
# CRITICAL, ERROR, WARNING, INFO and DEBUG. set by the -v / --verbose option.
sqlalchemy_echo_pool = false

# Path to .env file (optional)
dotenv_path = .env

